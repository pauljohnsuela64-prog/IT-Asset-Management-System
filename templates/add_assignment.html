{% extends "base.html" %}

{% block title %}Assign Asset{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="fw-bold mb-1">Assign Asset</h1>
                <p class="text-muted mb-0">Assign an available IT asset to an active employee.</p>
            </div>
            <a href="{{ url_for('home') }}" class="btn btn-outline-secondary">Back to Assets</a>
        </div>

        {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <div class="card shadow-sm">
            <div class="card-body p-4">
                <form id="assign-asset-form" method="POST" action="{{ url_for('add_assignment') }}">
                    <div class="row g-3">
                        <div class="col-12">
                            <label for="asset_id" class="form-label">Asset</label>
                            <select id="asset_id" name="asset_id" class="form-select" required>
                                <option value="">Select Asset</option>
                                {% for asset in assets %}
                                    <option value="{{ asset.asset_id }}" {% if request.form.get('asset_id') == asset.asset_id|string %}selected{% endif %}>
                                        {{ asset.asset_tag }} - {{ asset.device_name }} - {{ asset.brand }} {{ asset.model or '' }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-12">
                            <label for="employee_id" class="form-label">Employee</label>
                            <select id="employee_id" name="employee_id" class="form-select" required>
                                <option value="">Select Employee</option>
                                {% for employee in employees %}
                                    <option value="{{ employee.employee_id }}" {% if request.form.get('employee_id') == employee.employee_id|string %}selected{% endif %}>
                                        {{ employee.employee_code }} - {{ employee.full_name }} - {{ employee.department }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="assigned_date" class="form-label">Assigned Date</label>
                            <input type="date" id="assigned_date" name="assigned_date" class="form-control"
                                   value="{{ request.form.get('assigned_date', '') }}" required>
                        </div>
                        <div class="col-12">
                            <label for="notes" class="form-label">Notes</label>
                            <textarea id="notes" name="notes" class="form-control" rows="4"
                                      placeholder="Optional assignment notes">{{ request.form.get('notes', '') }}</textarea>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{{ url_for('home') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" form="assign-asset-form" class="btn btn-primary">Assign Asset</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
