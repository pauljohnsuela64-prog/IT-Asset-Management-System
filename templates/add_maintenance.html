{% extends "base.html" %}

{% block title %}Add Maintenance Record{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="fw-bold mb-1">Add Maintenance Record</h1>
                <p class="text-muted mb-0">Record a maintenance issue for an available asset.</p>
            </div>
            <a href="{{ url_for('maintenance') }}" class="btn btn-outline-secondary">Back to Maintenance History</a>
        </div>

        {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <div class="card shadow-sm">
            <div class="card-body p-4">
                <form id="add-maintenance-form" method="POST" action="{{ url_for('add_maintenance') }}">
                    <div class="row g-3">
                        <div class="col-12">
                            <label for="asset_id" class="form-label">Asset</label>
                            <select id="asset_id" name="asset_id" class="form-select" required>
                                <option value="">Select Asset</option>
                                {% for asset in assets %}
                                    <option value="{{ asset.asset_id }}" {% if request.form.get('asset_id') == asset.asset_id|string %}selected{% endif %}>
                                        {{ asset.asset_tag }} - {{ asset.device_name }} - {{ asset.brand }} {{ asset.model or '' }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="maintenance_date" class="form-label">Maintenance Date</label>
                            <input type="date" id="maintenance_date" name="maintenance_date" class="form-control"
                                   value="{{ request.form.get('maintenance_date', '') }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="maintenance_type" class="form-label">Maintenance Type</label>
                            <select id="maintenance_type" name="maintenance_type" class="form-select" required>
                                <option value="">Select Type</option>
                                <option value="Repair" {% if request.form.get('maintenance_type') == "Repair" %}selected{% endif %}>Repair</option>
                                <option value="Preventive Maintenance" {% if request.form.get('maintenance_type') == "Preventive Maintenance" %}selected{% endif %}>Preventive Maintenance</option>
                                <option value="Inspection" {% if request.form.get('maintenance_type') == "Inspection" %}selected{% endif %}>Inspection</option>
                                <option value="Upgrade" {% if request.form.get('maintenance_type') == "Upgrade" %}selected{% endif %}>Upgrade</option>
                                <option value="Other" {% if request.form.get('maintenance_type') == "Other" %}selected{% endif %}>Other</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label for="issue_description" class="form-label">Issue Description</label>
                            <textarea id="issue_description" name="issue_description" class="form-control" rows="4" required>{{ request.form.get('issue_description', '') }}</textarea>
                        </div>
                        <div class="col-md-6">
                            <label for="technician_vendor" class="form-label">Technician / Vendor</label>
                            <input type="text" id="technician_vendor" name="technician_vendor" class="form-control"
                                   value="{{ request.form.get('technician_vendor', '') }}">
                        </div>
                        <div class="col-md-6">
                            <label for="cost" class="form-label">Cost</label>
                            <input type="number" id="cost" name="cost" class="form-control"
                                   value="{{ request.form.get('cost', '0.00') }}" min="0" step="0.01">
                        </div>
                        <div class="col-12">
                            <label for="notes" class="form-label">Notes</label>
                            <textarea id="notes" name="notes" class="form-control" rows="4">{{ request.form.get('notes', '') }}</textarea>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{{ url_for('maintenance') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" form="add-maintenance-form" class="btn btn-primary">Save Maintenance Record</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
