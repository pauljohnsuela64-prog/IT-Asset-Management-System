<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add User</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<div class="container">

    <h1>Add User</h1>
    <p>Create a new application account.</p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <label>Username</label>

        <input
            type="text"
            name="username"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            required
        >

        <label>Confirm Password</label>

        <input
            type="password"
            name="confirm_password"
            required
        >

        <label>Role</label>

        <select name="role" required>

            <option value="">
                Select Role
            </option>

            <option value="Staff">
                Staff
            </option>

            <option value="Admin">
                Admin
            </option>

        </select>

        <div class="form-actions">

            <button type="submit">
                Create User
            </button>

            <a href="{{ url_for('users') }}">
                Cancel
            </a>

        </div>

    </form>

</div>

</body>
</html>
