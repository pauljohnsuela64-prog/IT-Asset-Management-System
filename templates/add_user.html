{% extends "base.html" %}

{% block title %}Add User{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="fw-bold mb-1">Add User</h1>
                <p class="text-muted mb-0">Create a new application account.</p>
            </div>
            <a href="{{ url_for('users') }}" class="btn btn-outline-secondary">Back to User Management</a>
        </div>

        {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <div class="card shadow-sm">
            <div class="card-body p-4">
                <form id="add-user-form" method="POST" action="{{ url_for('add_user') }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" id="username" name="username" class="form-control"
                                   value="{{ request.form.get('username', '') }}" autocomplete="username" required>
                        </div>
                        <div class="col-md-6">
                            <label for="role" class="form-label">Role</label>
                            <select id="role" name="role" class="form-select" required>
                                <option value="">Select Role</option>
                                <option value="Staff" {% if request.form.get('role') == 'Staff' %}selected{% endif %}>Staff</option>
                                <option value="Admin" {% if request.form.get('role') == 'Admin' %}selected{% endif %}>Admin</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" id="password" name="password" class="form-control"
                                   autocomplete="new-password" required>
                        </div>
                        <div class="col-md-6">
                            <label for="confirm_password" class="form-label">Confirm Password</label>
                            <input type="password" id="confirm_password" name="confirm_password" class="form-control"
                                   autocomplete="new-password" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{{ url_for('users') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" form="add-user-form" class="btn btn-primary">Create User</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
