<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Employee</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<div class="container">

    <h1>Add Employee</h1>
    <p>Create a new employee record.</p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <label>Employee Code</label>

        <input
            type="text"
            name="employee_code"
            required
        >

        <label>Full Name</label>

        <input
            type="text"
            name="full_name"
            required
        >

        <label>Department</label>

        <input
            type="text"
            name="department"
            required
        >

        <label>Position</label>

        <input
            type="text"
            name="position"
        >

        <label>Email</label>

        <input
            type="email"
            name="email"
        >

        <div class="form-actions">

            <button type="submit">
                Save Employee
            </button>

            <a href="{{ url_for('employees') }}">
                Cancel
            </a>

        </div>

    </form>

</div>

</body>
</html>
