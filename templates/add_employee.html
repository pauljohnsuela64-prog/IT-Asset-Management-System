{% extends "base.html" %}

{% block title %}Add Employee{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="fw-bold mb-1">Add Employee</h1>
                <p class="text-muted mb-0">Create a new employee record.</p>
            </div>
            <a href="{{ url_for('employees') }}" class="btn btn-outline-secondary">Back to Employees</a>
        </div>

        {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <div class="card shadow-sm">
            <div class="card-body p-4">
                <form id="add-employee-form" method="POST" action="{{ url_for('add_employee') }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="employee_code" class="form-label">Employee Code</label>
                            <input type="text" id="employee_code" name="employee_code" class="form-control"
                                   value="{{ request.form.get('employee_code', '') }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="full_name" class="form-label">Full Name</label>
                            <input type="text" id="full_name" name="full_name" class="form-control"
                                   value="{{ request.form.get('full_name', '') }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="department" class="form-label">Department</label>
                            <input type="text" id="department" name="department" class="form-control"
                                   value="{{ request.form.get('department', '') }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="position" class="form-label">Position</label>
                            <input type="text" id="position" name="position" class="form-control"
                                   value="{{ request.form.get('position', '') }}">
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" name="email" class="form-control"
                                   value="{{ request.form.get('email', '') }}">
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{{ url_for('employees') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" form="add-employee-form" class="btn btn-primary">Save Employee</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
