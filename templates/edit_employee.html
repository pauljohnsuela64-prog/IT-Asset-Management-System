{% extends "base.html" %}

{% block title %}Edit Employee{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="fw-bold mb-1">Edit Employee</h1>
                <p class="text-muted mb-0">Update the selected employee record.</p>
            </div>
            <a href="{{ url_for('employees') }}" class="btn btn-outline-secondary">Back to Employees</a>
        </div>

        {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <div class="card shadow-sm">
            <div class="card-body p-4">
                <form id="edit-employee-form" method="POST" action="{{ url_for('edit_employee', employee_id=employee.employee_id) }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="employee_code" class="form-label">Employee Code</label>
                            <input type="text" id="employee_code" name="employee_code" class="form-control"
                                   value="{{ employee.employee_code or '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="full_name" class="form-label">Full Name</label>
                            <input type="text" id="full_name" name="full_name" class="form-control"
                                   value="{{ employee.full_name or '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="department" class="form-label">Department</label>
                            <input type="text" id="department" name="department" class="form-control"
                                   value="{{ employee.department or '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="position" class="form-label">Position</label>
                            <input type="text" id="position" name="position" class="form-control"
                                   value="{{ employee.position or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" name="email" class="form-control"
                                   value="{{ employee.email or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label for="status" class="form-label">Status</label>
                            <select id="status" name="status" class="form-select" required>
                                <option value="Active" {% if employee.status == "Active" %}selected{% endif %}>Active</option>
                                <option value="Inactive" {% if employee.status == "Inactive" %}selected{% endif %}>Inactive</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{{ url_for('employees') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" form="edit-employee-form" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
