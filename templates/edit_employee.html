<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Employee</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<div class="container">

    <h1>Edit Employee</h1>
    <p>Update the selected employee record.</p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <label>Employee Code</label>
        <input
            type="text"
            name="employee_code"
            value="{{ employee.employee_code }}"
            required
        >

        <label>Full Name</label>
        <input
            type="text"
            name="full_name"
            value="{{ employee.full_name }}"
            required
        >

        <label>Department</label>
        <input
            type="text"
            name="department"
            value="{{ employee.department }}"
            required
        >

        <label>Position</label>
        <input
            type="text"
            name="position"
            value="{{ employee.position or '' }}"
        >

        <label>Email</label>
        <input
            type="email"
            name="email"
            value="{{ employee.email or '' }}"
        >

        <label>Status</label>
        <select name="status" required>

            <option value="Active"
                {% if employee.status == "Active" %}selected{% endif %}>
                Active
            </option>

            <option value="Inactive"
                {% if employee.status == "Inactive" %}selected{% endif %}>
                Inactive
            </option>

        </select>

        <div class="form-actions">

            <button type="submit">
                Save Changes
            </button>

            <a href="{{ url_for('employees') }}">
                Cancel
            </a>

        </div>

    </form>

</div>

</body>
</html>
